name: Site artwork (Gemini)

on:
  push:
    branches: ["claude/**"]
    paths: ["tools/site-art/**", ".github/workflows/site-art.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-art-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Draw pictures
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 tools/site-art/generate.py
      - uses: actions/upload-artifact@v4
        with:
          name: site-art
          path: assets/ai/*.png
          if-no-files-found: warn
      - name: Commit pictures to this branch
        run: |
          git add assets/ai
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898+github-actions[bot]@users.noreply.github.com" \
            commit -m "Site artwork drawn with Gemini"
          git push origin HEAD:${{ github.ref_name }}
